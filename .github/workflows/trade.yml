name: DarkerDB AI Trader

on:
  schedule:
    - cron: '17 * * * *'  # 每小时第17分钟（UTC），避开整点和半点高峰
  workflow_dispatch:


jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: pip install -r requirements.txt
        
      - name: Run AI Trader
        env:
          DARKERDB_KEY: ${{ secrets.DARKERDB_KEY }}
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY }}
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          DARKERDB_KEYS: ${{ secrets.DARKERDB_KEYS }}
        run: python trader.py
        
      - name: Commit memory
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add price_memory.json
          git commit -m "Update price memory" || echo "No changes"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
